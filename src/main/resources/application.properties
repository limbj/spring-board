# Default local profile; credentials are supplied by environment variables or JVM properties.
# SPRING_BOARD_DB_PROFILE=h2|oracle
# SPRING_BOARD_DB_URL, SPRING_BOARD_DB_USER, SPRING_BOARD_DB_PASSWORD
# SPRING_BOARD_DATA_DIR defaults to ./data.
app.db.profile=h2
app.db.pool-size=5
app.db.connection-timeout-ms=10000

# Override with SPRING_BOARD_UPLOAD_DIR or -Dspringboard.uploadDir=...
upload.dir=${springboard.uploadDir:${SPRING_BOARD_UPLOAD_DIR:./data/uploads}}
